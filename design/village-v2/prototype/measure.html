<!doctype html><html><body><svg id="s" width="2000" height="2000" viewBox="-1000 -1000 2000 2000"></svg><pre id="o"></pre>
<script src="iso.js"></script><script>
const {A, botSprite, ring} = Iso;
const L = [

const s=document.getElementById('s'), out=[];
L.forEach(([file,group,role,fn])=>{ s.innerHTML='<defs>'+Iso.BASE_DEFS+Iso.takeDefs()+'</defs><g id="g">'+fn()+'</g>'; const b=document.getElementById('g').getBBox();
  const x=Math.floor(b.x)-2,y=Math.floor(b.y)-2,w=Math.ceil(b.width)+4,h=Math.ceil(b.height)+4;
  out.push({file,group,role,size_1x:[w,h],size_2x:[w*2,h*2],anchor_px_1x:[-x,-y],anchor_rule:'world origin (0,0,0) of the prop',frames:1}); });
['cli','codex','app'].forEach(src=>{ s.innerHTML='<defs>'+Iso.BASE_DEFS+Iso.takeDefs()+'</defs><g id="g">'+botSprite(src,'approval')+'</g>'; const b=document.getElementById('g').getBBox();
  out.push({file:`bot-${src}.webp`,group:'bot',role:`Sprite sheet for source ${Iso.SOURCE[src].label}`,frame_size_1x:[48,72],frame_size_2x:[96,144],sheet_layout:'4 columns (f0-f3) x 6 rows (working, idle, approval, input, error, offline)',sheet_size_2x:[384,864],anchor_px_1x:[24,66],anchor_rule:'ground contact point, bottom centre; bot body floats 12 px above it',frames:{working:4,idle:4,approval:4,input:4,error:4,offline:1},measured_body_bbox_1x:[Math.round(b.width),Math.round(b.height)]}); });

</script></body></html>
